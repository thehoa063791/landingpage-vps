<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Vào học ngay · {{title}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/p/zoom-event/style.css">
</head>

<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="/zoom">← Trang sự kiện</a>
      <span class="badge">{{title}}</span>
    </div>
  </header>

  <main class="main">
    <div class="container">
      <section class="card panel" id="joinPanel">
        <ol class="steps" aria-label="Các bước đăng ký">
          <li class="done"><b aria-hidden="true">✓</b>Email</li>
          <li class="done"><b aria-hidden="true">✓</b>Thông tin</li>
          <li class="active" aria-current="step"><b>3</b>Vào học</li>
        </ol>
        <div class="success-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9.5 16.2 5.3 12l-1.4 1.4 5.6 5.6L21.5 7l-1.4-1.4z"/></svg></div>
        <h1 id="greeting">Bạn đã sẵn sàng tham gia!</h1>
        <p class="lead" id="joinLead" hidden></p>

        <div class="join-when" {{event_hidden}}>
          <small>Thời gian diễn ra</small>
          <strong>{{event_time}} · <span style="text-transform:capitalize">{{event_weekday}}</span>, {{event_date}}</strong>
        </div>
        <div {{event_hidden}} data-countdown data-starts-at="{{starts_at}}" data-ends-at="{{ends_at}}">
          <div class="countdown" data-countdown-units aria-label="Thời gian đếm ngược">
            <div class="unit"><strong data-d>00</strong><small>ngày</small></div><span class="colon">:</span>
            <div class="unit"><strong data-h>00</strong><small>giờ</small></div><span class="colon">:</span>
            <div class="unit"><strong data-m>00</strong><small>phút</small></div><span class="colon">:</span>
            <div class="unit"><strong data-s>00</strong><small>giây</small></div>
          </div>
          <p class="countdown-status join-when" data-countdown-status hidden></p>
        </div>

        <a class="btn-primary btn-join is-waiting" id="joinLink" href="#" aria-disabled="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h8A2.5 2.5 0 0 1 16 6.5v1.8l3.4-2.3A1 1 0 0 1 21 6.8v10.4a1 1 0 0 1-1.6.8L16 15.7v1.8a2.5 2.5 0 0 1-2.5 2.5h-8A2.5 2.5 0 0 1 3 17.5v-11Z"/></svg>
          <span class="spinner" aria-hidden="true"></span><span data-label>VÀO HỌC NGAY</span>
        </a>
        <p class="notice" id="notice" role="status" hidden></p>

        <div class="join-tools">
          <button class="btn-ghost" type="button" id="copyLink">Sao chép link trang này</button>
          <a class="btn-ghost" id="calendarLink" href="#" target="_blank" rel="noopener" {{event_hidden}} data-title="{{title}}" data-starts-at="{{starts_at}}" data-ends-at="{{ends_at}}" data-when="{{event_time}}, {{event_weekday}} {{event_date}}">Thêm vào Google Calendar</a>
        </div>
      </section>
    </div>
  </main>

  {{{footer}}}

  <script src="/p/zoom-event/common.js" defer></script>
  <script src="/p/zoom-event/join.js" defer></script>
</body>

</html>
