<body class="flow">
  <main class="container flow-wrap">
    <div class="card">
      <h1>Vào học</h1>
      <p class="lead">Phương pháp xây dựng Dòng Tiền</p>
      <form id="email-form" novalidate>
        <label for="email">Email của bạn</label>
        <input id="email" type="email" autocomplete="email" placeholder="ban@gmail.com" required>
        <p class="form-error" id="email-error" role="alert" hidden></p>
        <button class="button-gold" type="submit">Tiếp tục</button>
      </form>
      <form id="registration-form" novalidate hidden>
        <p class="step-text">Email này chưa đăng ký. Bạn điền thêm thông tin để tham gia nhé.</p>
        <label for="name">Họ và tên</label>
        <input id="name" name="name" autocomplete="name" maxlength="120" placeholder="Tên của bạn" required>
        <label for="phone">Số điện thoại / Zalo</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="Số điện thoại" required>
        <p class="form-error" id="form-error" role="alert" hidden></p>
        <button class="button-gold" type="submit">Hoàn tất đăng ký</button>
      </form>
      <p class="help">Cần hỗ trợ? Gọi <a href="tel:0862421919">086 242 1919</a>.</p>
    </div>
  </main>
</body>

</html>
