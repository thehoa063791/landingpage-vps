services:
  nextjs:
    # Build from local source or pull prebuilt image from registry
    build:
      context: .
      dockerfile: Dockerfile
    image: ${REGISTRY_IMAGE:-next_dong_tien}:${IMAGE_TAG:-latest}

    container_name: next_dong_tien

    ports:
      - "${PORT:-3002}:3002"

    env_file:
      - .env

    environment:
      PORT: 3002
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      ADMIN_API_URL: ${ADMIN_API_URL:-http://172.17.0.1:3001}
      LEAD_API_KEY: ${LEAD_API_KEY}

    restart: always

    mem_limit: 1g
    cpus: 1

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
