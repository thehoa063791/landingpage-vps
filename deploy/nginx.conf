# /etc/nginx/sites-available/landingpage.conf
# ------------------------------------------------------------
# Nginx reverse proxy for the Node app on 127.0.0.1:3001.
# TLS block assumes certbot has issued a cert for your domain.
# ------------------------------------------------------------

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name event.phamthanhbien.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name event.phamthanhbien.com;

    # certbot --nginx will fill these in
    ssl_certificate     /etc/letsencrypt/live/event.phamthanhbien.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/event.phamthanhbien.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Uploads (multipart, media) — leave generous headroom.
    client_max_body_size 50m;

    # Standard security headers
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Gzip for text responses
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Long-cache the local storage bucket (served by Express with maxAge=7d,
    # but Nginx also caches for browsers behind proxies).
    location /storage/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Main app
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
    }
}
